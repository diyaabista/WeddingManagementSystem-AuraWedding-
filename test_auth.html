<!DOCTYPE html>
<html>
<head>
    <title>Auth Test</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; }
        textarea { width: 100%; height: 200px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Test Auth.php Endpoint</h1>
    
    <div>
        <label>Email:</label>
        <input type="text" id="email" value="host@aurawedding.com" style="width:100%">
    </div>
    
    <div>
        <label>Password:</label>
        <input type="password" id="password" value="wedding123" style="width:100%">
    </div>
    
    <div>
        <label>Login Type:</label>
        <select id="loginType" style="width:100%">
            <option value="user">User</option>
            <option value="admin">Admin</option>
            <option value="planner">Planner</option>
        </select>
    </div>
    
    <button onclick="testAuth()">Test Login Request</button>
    <button onclick="testPHP()" style="margin-left:10px">Test PHP First</button>
    
    <h2>Response:</h2>
    <textarea id="response" readonly></textarea>
    
    <script>
        async function testPHP() {
            const responseArea = document.getElementById('response');
            responseArea.value = 'Testing PHP...';
            
            try {
                const response = await fetch('test_php.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'test=1'
                });
                
                const text = await response.text();
                responseArea.value = 'Status: ' + response.status + '\n\n' + text;
            } catch (error) {
                responseArea.value = 'Fetch Error: ' + error.message;
            }
        }
        
        async function testAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginType = document.getElementById('loginType').value;
            const responseArea = document.getElementById('response');
            
            responseArea.value = 'Sending request...';
            
            try {
                const response = await fetch('php/auth_simple.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        action: 'login',
                        email: email,
                        password: password,
                        login_type: loginType
                    })
                });
                
                responseArea.value = 'Status: ' + response.status + '\n';
                responseArea.value += 'Headers:\n';
                for (let [key, value] of response.headers.entries()) {
                    responseArea.value += '  ' + key + ': ' + value + '\n';
                }
                
                const text = await response.text();
                responseArea.value += '\nRaw Response:\n' + text;
                
                try {
                    const data = JSON.parse(text);
                    responseArea.value += '\n\nParsed JSON:\n' + JSON.stringify(data, null, 2);
                } catch (e) {
                    responseArea.value += '\n\nJSON Parse Error: ' + e.message;
                }
            } catch (error) {
                responseArea.value = 'Fetch Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
