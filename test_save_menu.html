<!DOCTYPE html>
<html>
<head>
    <title>Save Menu Test</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        button { padding: 10px 20px; margin: 5px; background: #ec4899; color: white; border: none; border-radius: 5px; cursor: pointer; }
        pre { background: #f0f0f0; padding: 10px; overflow-x: auto; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

<h1>🧪 Save Menu Test</h1>

<div class="section">
    <h2>Step 1: Check Session</h2>
    <button onclick="checkSession()">Check Session</button>
    <pre id="sessionResult"></pre>
</div>

<div class="section">
    <h2>Step 2: Login as User</h2>
    <input type="email" id="email" value="testuser@demo.com" placeholder="Email">
    <input type="password" id="password" value="wedding123" placeholder="Password">
    <button onclick="login()">Login</button>
    <pre id="loginResult"></pre>
</div>

<div class="section">
    <h2>Step 3: Save Menu</h2>
    <button onclick="saveMenu()">Save Sample Menu (Items 1,2,3)</button>
    <pre id="menuResult"></pre>
</div>

<script>
async function checkSession() {
    const result = document.getElementById('sessionResult');
    result.textContent = 'Checking session...';
    try {
        const res = await fetch('test_session.php');
        const data = await res.json();
        result.textContent = JSON.stringify(data, null, 2);
    } catch (e) {
        result.innerHTML = '<span class="error">Error: ' + e.message + '</span>';
    }
}

async function login() {
    const result = document.getElementById('loginResult');
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    result.textContent = 'Logging in...';
    try {
        const res = await fetch('php/auth_simple.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                action: 'login',
                email: email,
                password: password,
                login_type: 'user'
            })
        });
        const data = await res.json();
        if (data.success) {
            result.innerHTML = '<span class="success">✅ Login successful!</span>\n' + JSON.stringify(data, null, 2);
        } else {
            result.innerHTML = '<span class="error">❌ Login failed</span>\n' + JSON.stringify(data, null, 2);
        }
    } catch (e) {
        result.innerHTML = '<span class="error">Error: ' + e.message + '</span>';
    }
}

async function saveMenu() {
    const result = document.getElementById('menuResult');
    result.textContent = 'Saving menu...';
    try {
        const fd = new FormData();
        fd.append('action', 'save_menu');
        fd.append('menu_ids[]', '1');
        fd.append('menu_ids[]', '2');
        fd.append('menu_ids[]', '3');
        
        const res = await fetch('php/events.php', {
            method: 'POST',
            body: fd
        });
        
        const responseText = await res.text();
        console.log('Raw response:', responseText);
        
        try {
            const data = JSON.parse(responseText);
            if (data.success) {
                result.innerHTML = '<span class="success">✅ Menu saved!</span>\n' + JSON.stringify(data, null, 2);
            } else {
                result.innerHTML = '<span class="error">❌ Save failed</span>\n' + JSON.stringify(data, null, 2);
            }
        } catch (parseErr) {
            result.innerHTML = '<span class="error">❌ JSON Parse Error</span>\n' +
                '<strong>Response:</strong> ' + responseText.substring(0, 200) + '\n\n' +
                '<strong>Error:</strong> ' + parseErr.message;
        }
    } catch (e) {
        result.innerHTML = '<span class="error">Error: ' + e.message + '</span>';
    }
}

// Check session on load
window.onload = checkSession;
</script>

</body>
</html>
