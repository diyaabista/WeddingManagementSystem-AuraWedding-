<!DOCTYPE html>
<html>
<head>
    <title>Sign In Button Diagnostic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .box { background: white; padding: 30px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h1 { color: #333; margin-bottom: 10px; }
        h2 { color: #667eea; margin-top: 20px; margin-bottom: 15px; font-size: 18px; }
        p { color: #666; line-height: 1.6; margin-bottom: 10px; }
        .status { padding: 12px; border-radius: 6px; margin: 10px 0; font-size: 14px; font-weight: 500; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        
        .test-form { background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 15px 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #333; font-weight: 600; }
        input { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 14px; }
        input:focus { outline: none; border-color: #667eea; }
        
        button { padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; margin-top: 10px; transition: all 0.3s; }
        button:hover { background: #764ba2; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        button:active { transform: translateY(0); }
        
        .log { background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 6px; margin: 10px 0; font-family: 'Courier New', monospace; font-size: 12px; max-height: 300px; overflow-y: auto; }
        
        .feature-list { list-style: none; padding: 0; }
        .feature-list li { padding: 8px 0; padding-left: 25px; position: relative; }
        .feature-list li:before { content: "✓"; position: absolute; left: 0; color: #28a745; font-weight: bold; }
        
        .button-test-area { margin: 30px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <h1>🔐 Sign In Button Diagnostic Test</h1>
            <p>This page will test if the Sign In button is working correctly in your AuraWedding application.</p>
        </div>

        <div class="box">
            <h2>Step 1: Check Form Elements</h2>
            <button onclick="checkFormElements()">Check Form Elements</button>
            <div id="formStatus"></div>
        </div>

        <div class="box">
            <h2>Step 2: Test Button Click</h2>
            <div class="test-form">
                <div class="form-group">
                    <label>Test Button:</label>
                    <button type="button" onclick="handleTestClick(event)">Click Me Test Button</button>
                </div>
            </div>
            <div id="clickStatus"></div>
        </div>

        <div class="box">
            <h2>Step 3: Test AuraWedding.simpleLogin()</h2>
            <div class="test-form">
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="testEmail" value="host@aurawedding.com" placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="testPassword" value="wedding123" placeholder="Enter password">
                </div>
                <button type="button" onclick="testSimpleLogin()">Test simpleLogin() Function</button>
            </div>
            <div id="loginStatus"></div>
        </div>

        <div class="box">
            <h2>Step 4: Console Logs</h2>
            <div class="log" id="consoleLogs">Waiting for tests...</div>
        </div>

        <div class="box">
            <h2>Step 5: App.js Verification</h2>
            <button onclick="verifyAppJS()">Verify App.js Loaded</button>
            <div id="appStatus"></div>
        </div>
    </div>

    <script>
        // Log everything to both console and the page
        const logs = [];
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const message = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : String(arg)).join(' ');
            logs.push(`[${new Date().toLocaleTimeString()}] ${message}`);
            updateLogs();
        };

        function updateLogs() {
            const logDiv = document.getElementById('consoleLogs');
            logDiv.textContent = logs.slice(-20).join('\n'); // Show last 20 logs
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function checkFormElements() {
            console.log('=== Checking Form Elements ===');
            let html = '';
            
            const loginEmail = document.getElementById('loginEmail');
            const loginPassword = document.getElementById('loginPassword');
            const loginType = document.getElementById('loginType');
            const loginForm = document.getElementById('loginForm');
            const signInBtn = document.querySelector('button[onclick*="simpleLogin"]');
            
            console.log('loginEmail found:', !!loginEmail);
            console.log('loginPassword found:', !!loginPassword);
            console.log('loginType found:', !!loginType);
            console.log('loginForm found:', !!loginForm);
            console.log('Sign In button found:', !!signInBtn);
            
            html += loginEmail ? '<div class="status success">✓ Email input found</div>' : '<div class="status error">✗ Email input NOT found</div>';
            html += loginPassword ? '<div class="status success">✓ Password input found</div>' : '<div class="status error">✗ Password input NOT found</div>';
            html += loginType ? '<div class="status success">✓ Login type input found</div>' : '<div class="status error">✗ Login type input NOT found</div>';
            html += loginForm ? '<div class="status success">✓ Login form found</div>' : '<div class="status error">✗ Login form NOT found</div>';
            html += signInBtn ? '<div class="status success">✓ Sign In button found with onclick handler</div>' : '<div class="status error">✗ Sign In button NOT found</div>';
            
            document.getElementById('formStatus').innerHTML = html;
        }

        function handleTestClick(event) {
            console.log('✓ TEST BUTTON CLICK FIRED');
            console.log('Event type:', event.type);
            console.log('Event target:', event.target.textContent);
            document.getElementById('clickStatus').innerHTML = '<div class="status success">✓ Button click works! Event listener is active.</div>';
        }

        function testSimpleLogin() {
            console.log('=== Testing AuraWedding.simpleLogin() ===');
            
            // Check if AuraWedding exists
            if (typeof window.AuraWedding === 'undefined') {
                console.log('❌ AuraWedding object not found - app.js may not be loaded');
                document.getElementById('loginStatus').innerHTML = '<div class="status error">❌ AuraWedding object not loaded. Check if app.js is included in index.html</div>';
                return;
            }
            
            console.log('✓ AuraWedding object exists');
            
            if (typeof window.AuraWedding.simpleLogin !== 'function') {
                console.log('❌ simpleLogin function not found');
                document.getElementById('loginStatus').innerHTML = '<div class="status error">❌ simpleLogin() function not found in AuraWedding object</div>';
                return;
            }
            
            console.log('✓ simpleLogin function exists');
            console.log('Calling AuraWedding.simpleLogin()...');
            
            try {
                const result = window.AuraWedding.simpleLogin();
                console.log('simpleLogin() returned:', result);
                document.getElementById('loginStatus').innerHTML = '<div class="status info">Function called. Check console for detailed logs.</div>';
            } catch (err) {
                console.log('❌ Error calling simpleLogin():', err);
                document.getElementById('loginStatus').innerHTML = '<div class="status error">❌ Error: ' + err.message + '</div>';
            }
        }

        function verifyAppJS() {
            console.log('=== Verifying App.js ===');
            let html = '';
            
            if (typeof window.AuraWedding === 'undefined') {
                html = '<div class="status error">❌ AuraWedding object not loaded</div>';
            } else {
                html = '<div class="status success">✓ AuraWedding object exists</div>';
                html += typeof window.AuraWedding.init === 'function' ? '<div class="status success">✓ init() method exists</div>' : '<div class="status error">✗ init() method missing</div>';
                html += typeof window.AuraWedding.simpleLogin === 'function' ? '<div class="status success">✓ simpleLogin() method exists</div>' : '<div class="status error">✗ simpleLogin() method missing</div>';
                html += typeof window.AuraWedding.handleLogin === 'function' ? '<div class="status success">✓ handleLogin() method exists</div>' : '<div class="status error">✗ handleLogin() method missing</div>';
                html += typeof window.AuraWedding.showToast === 'function' ? '<div class="status success">✓ showToast() method exists</div>' : '<div class="status error">✗ showToast() method missing</div>';
            }
            
            document.getElementById('appStatus').innerHTML = html;
        }

        // Auto-check on load
        window.addEventListener('load', () => {
            console.log('Page loaded - running diagnostics...');
            setTimeout(() => {
                checkFormElements();
                verifyAppJS();
            }, 1000);
        });
    </script>

    <!-- Include app.js to test -->
    <script src="js/app.js"></script>
</body>
</html>
