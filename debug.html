<!DOCTYPE html>
<html>
<head>
  <title>Login Test</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .test-result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    .pass { background: #d4edda; color: #155724; }
    .fail { background: #f8d7da; color: #721c24; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    #testLog { border: 1px solid #ddd; padding: 10px; height: 300px; overflow-y: auto; background: #f9f9f9; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <h1>AuraWedding Login Test</h1>
  
  <div id="results"></div>
  <hr>
  
  <h2>Test Actions:</h2>
  <button onclick="testFunctions()">Test AuraWedding Functions</button>
  <button onclick="testFormBinding()">Test Form Binding</button>
  <button onclick="testLoginModal()">Test Login Modal</button>
  <button onclick="console.clear(); logDiv.innerHTML = ''">Clear Console</button>
  
  <h2>Console Output:</h2>
  <div id="testLog"></div>
  
  <script src="js/app.js"></script>
  <script>
    const logDiv = document.getElementById('testLog');
    const resultsDiv = document.getElementById('results');
    
    // Override console.log to display in div
    const originalLog = console.log;
    console.log = function(...args) {
      originalLog(...args);
      const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : a).join(' ');
      logDiv.innerHTML += msg + '\n';
      logDiv.scrollTop = logDiv.scrollHeight;
    };
    
    console.error = function(...args) {
      const msg = '❌ ERROR: ' + args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : a).join(' ');
      logDiv.innerHTML += msg + '\n';
      logDiv.scrollTop = logDiv.scrollHeight;
    };
    
    function testFunctions() {
      console.log('=== Testing AuraWedding Functions ===');
      
      let html = '';
      
      const tests = [
        { name: 'AuraWedding object', fn: () => typeof AuraWedding !== 'undefined' },
        { name: 'init() function', fn: () => typeof AuraWedding?.init === 'function' },
        { name: 'openModal() function', fn: () => typeof AuraWedding?.openModal === 'function' },
        { name: 'openLoginModal() function', fn: () => typeof AuraWedding?.openLoginModal === 'function' },
        { name: 'handleLogin() function', fn: () => typeof AuraWedding?.handleLogin === 'function' },
        { name: 'navigateTo() function', fn: () => typeof AuraWedding?.navigateTo === 'function' },
      ];
      
      tests.forEach(test => {
        const result = test.fn();
        html += `<div class="test-result ${result ? 'pass' : 'fail'}">
          ${result ? '✅' : '❌'} ${test.name}
        </div>`;
        console.log((result ? '✅' : '❌') + ' ' + test.name);
      });
      
      resultsDiv.innerHTML = html;
    }
    
    function testFormBinding() {
      console.log('=== Testing Form Binding ===');
      
      const loginForm = document.getElementById('loginForm');
      console.log('loginForm found:', !!loginForm);
      console.log('loginForm ID:', loginForm?.id);
      
      const loginEmail = document.getElementById('loginEmail');
      console.log('loginEmail found:', !!loginEmail);
      
      const loginPassword = document.getElementById('loginPassword');
      console.log('loginPassword found:', !!loginPassword);
      
      const loginType = document.getElementById('loginType');
      console.log('loginType found:', !!loginType);
      console.log('loginType value:', loginType?.value);
    }
    
    function testLoginModal() {
      console.log('=== Testing Login Modal ===');
      console.log('Opening login select modal...');
      if (typeof AuraWedding !== 'undefined' && AuraWedding.openModal) {
        AuraWedding.openModal('modal-login-select');
        console.log('✅ Modal opened');
      } else {
        console.log('❌ AuraWedding.openModal not available');
      }
    }
    
    // Run tests on load
    window.addEventListener('load', () => {
      console.log('✅ Page loaded, testing functions...');
      setTimeout(() => {
        testFunctions();
      }, 500);
    });
  </script>
</body>
</html>
