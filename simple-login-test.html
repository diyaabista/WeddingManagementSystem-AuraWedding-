<!DOCTYPE html>
<html>
<head>
  <title>Simple Login Test</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    .container { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: 0 auto; }
    input, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
    button { background: #ff69b4; color: white; cursor: pointer; font-weight: bold; border: none; }
    button:hover { background: #ff1493; }
    .log { border: 1px solid #ddd; padding: 10px; margin: 20px 0; background: #f9f9f9; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌸 Simple Login Test</h1>
    
    <form id="testForm">
      <label>Email:</label>
      <input type="email" id="testEmail" value="host@aurawedding.com" required>
      
      <label>Password:</label>
      <input type="password" id="testPassword" value="wedding123" required>
      
      <label>Login Type:</label>
      <select id="testType" style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px;">
        <option value="user">User</option>
        <option value="admin">Admin</option>
        <option value="planner">Planner</option>
      </select>
      
      <button type="button" onclick="testLogin()">Test Login</button>
    </form>
    
    <div class="log" id="log"></div>
  </div>
  
  <script>
    const logEl = document.getElementById('log');
    
    function log(msg) {
      console.log(msg);
      logEl.innerHTML += msg + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }
    
    async function testLogin() {
      log('🔐 Starting login test...');
      
      const email = document.getElementById('testEmail').value;
      const password = document.getElementById('testPassword').value;
      const loginType = document.getElementById('testType').value;
      
      log(`📧 Email: ${email}`);
      log(`🔑 Password: ${password}`);
      log(`👤 Login Type: ${loginType}`);
      
      try {
        log('📤 Sending request to php/auth.php...');
        
        const response = await fetch('php/auth.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            action: 'login',
            email: email,
            password: password,
            login_type: loginType
          })
        });
        
        log(`✓ Response status: ${response.status}`);
        
        const data = await response.json();
        log('📊 Server Response: ' + JSON.stringify(data, null, 2));
        
        if (data.success) {
          log('✅ LOGIN SUCCESSFUL!');
          log(`👤 User: ${data.name}`);
          log(`🔐 Is Admin: ${data.is_admin}`);
        } else {
          log('❌ LOGIN FAILED: ' + data.message);
        }
        
      } catch (error) {
        log('❌ ERROR: ' + error.message);
      }
    }
    
    // Disable button initially and enable when ready
    log('⏳ Waiting for page to load...');
    window.addEventListener('load', () => {
      log('✅ Page loaded');
      document.querySelector('button').disabled = false;
    });
  </script>
</body>
</html>
