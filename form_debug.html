<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form Debug</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #f5f5f5; }
        .debug-box { background: white; padding: 20px; border-radius: 10px; margin: 20px 0; }
        h2 { color: #333; }
        pre { background: #f0f0f0; padding: 10px; border-radius: 5px; overflow-x: auto; }
        .form-test { border: 2px solid #ff6b9d; padding: 20px; max-width: 400px; }
        input { display: block; width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ff6b9d; color: white; border: none; cursor: pointer; border-radius: 5px; font-size: 16px; }
        .success { background: #90EE90; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #FFB6C6; padding: 10px; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🔐 Login Form Debug Tool</h1>
    
    <div class="debug-box">
        <h2>Form Elements Status</h2>
        <pre id="formStatus">Checking...</pre>
    </div>
    
    <div class="debug-box">
        <h2>Test Form Submission</h2>
        <form id="testLoginForm" class="form-test">
            <input type="email" id="testEmail" placeholder="Email" required value="host@aurawedding.com">
            <input type="password" id="testPassword" placeholder="Password" required value="wedding123">
            <button type="submit">Test Submit</button>
        </form>
        <div id="testResult"></div>
    </div>
    
    <div class="debug-box">
        <h2>AuraWedding App Status</h2>
        <pre id="appStatus">Waiting for initialization...</pre>
    </div>
    
    <div class="debug-box">
        <h2>Event Listener Status</h2>
        <pre id="listenerStatus">Checking...</pre>
    </div>

    <script>
        // Test 1: Check if form elements exist
        console.log('=== FORM DEBUG ===');
        const testForm = document.getElementById('testLoginForm');
        console.log('Test Form Found:', !!testForm);
        
        // Test form submission directly
        if (testForm) {
            testForm.addEventListener('submit', (e) => {
                e.preventDefault();
                console.log('✅ Test form submitted!');
                document.getElementById('testResult').innerHTML = '<div class="success">✅ Form submission works! Your form listeners are attached correctly.</div>';
            });
        }
        
        // Test 2: Check if AuraWedding exists
        console.log('Waiting for AuraWedding...');
        
        // Test 3: Check form elements on AuraWedding init
        document.addEventListener('DOMContentLoaded', () => {
            console.log('✅ DOMContentLoaded fired');
            
            // Check form
            const loginForm = document.getElementById('loginForm');
            const loginEmail = document.getElementById('loginEmail');
            const loginPassword = document.getElementById('loginPassword');
            const loginBtn = document.querySelector('button[type="submit"]');
            
            let status = `
AuraWedding Object: ${typeof window.AuraWedding !== 'undefined' ? '✅ EXISTS' : '❌ NOT FOUND'}
loginForm Element: ${loginForm ? '✅ FOUND' : '❌ NOT FOUND'}
loginEmail Input: ${loginEmail ? '✅ FOUND' : '❌ NOT FOUND'}
loginPassword Input: ${loginPassword ? '✅ FOUND' : '❌ NOT FOUND'}
Submit Button: ${loginBtn ? '✅ FOUND' : '❌ NOT FOUND'}

Form ID: ${loginForm ? loginForm.id : 'N/A'}
Form Element Count: ${document.querySelectorAll('form').length}
            `;
            
            document.getElementById('formStatus').textContent = status;
            
            // Check if form has listeners
            if (loginForm) {
                const hasListener = loginForm.onsubmit || (loginForm._getEventListeners && loginForm._getEventListeners('submit'));
                document.getElementById('listenerStatus').textContent = `Form listeners attached: ${hasListener ? '✅ Likely attached via addEventListener' : '❌ Check app.js console for details'}`;
            }
            
            // App status
            if (typeof window.AuraWedding !== 'undefined') {
                document.getElementById('appStatus').textContent = '✅ AuraWedding object loaded!\n\nCheck browser console (F12) for detailed init logs.';
            } else {
                document.getElementById('appStatus').textContent = '❌ AuraWedding not found. Check if app.js is loaded.';
            }
        });
    </script>
    
    <!-- Load the actual app.js -->
    <script src="js/app.js"></script>
</body>
</html>
