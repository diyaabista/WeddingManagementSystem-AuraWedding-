<!DOCTYPE html>
<html>
<head>
  <title>AuraWedding - JS Test</title>
</head>
<body>
  <h1>AuraWedding JavaScript Test</h1>
  <p>Check the browser console below for test results.</p>
  
  <hr>
  <h2>Test Results:</h2>
  <div id="results"></div>
  
  <script src="js/app.js"></script>
  <script>
    const resultsDiv = document.getElementById('results');
    
    window.addEventListener('load', () => {
      let html = '<ul>';
      
      // Test 1: AuraWedding object exists
      html += '<li>' + (typeof AuraWedding !== 'undefined' ? '✅' : '❌') + ' AuraWedding object exists</li>';
      
      // Test 2: Functions exist
      html += '<li>' + (typeof AuraWedding?.init === 'function' ? '✅' : '❌') + ' AuraWedding.init() exists</li>';
      html += '<li>' + (typeof AuraWedding?.openModal === 'function' ? '✅' : '❌') + ' AuraWedding.openModal() exists</li>';
      html += '<li>' + (typeof AuraWedding?.openLoginModal === 'function' ? '✅' : '❌') + ' AuraWedding.openLoginModal() exists</li>';
      html += '<li>' + (typeof AuraWedding?.handleLogin === 'function' ? '✅' : '❌') + ' AuraWedding.handleLogin() exists</li>';
      html += '<li>' + (typeof AuraWedding?.navigateTo === 'function' ? '✅' : '❌') + ' AuraWedding.navigateTo() exists</li>';
      html += '<li>' + (typeof AuraWedding?.showToast === 'function' ? '✅' : '❌') + ' AuraWedding.showToast() exists</li>';
      
      // Test 3: Other objects
      html += '<li>' + (typeof PlannerApp !== 'undefined' ? '✅' : '❌') + ' PlannerApp object exists</li>';
      html += '<li>' + (typeof PlaylistManager !== 'undefined' ? '✅' : '❌') + ' PlaylistManager object exists</li>';
      
      html += '</ul>';
      
      resultsDiv.innerHTML = html;
      
      // Log to console as well
      console.log('🧪 AuraWedding Test Results:');
      console.log('AuraWedding object:', AuraWedding);
      console.log('PlannerApp object:', PlannerApp);
      console.log('PlaylistManager object:', PlaylistManager);
    });
  </script>
</body>
</html>
